name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find project (extract "VJORO player.tgz" if needed)
        run: |
          if [ -f settings.gradle ] || [ -f settings.gradle.kts ]; then
            PROJ="."
          else
            TGZ=$(find . -maxdepth 2 \( -iname "*.tgz" -o -iname "*.tar.gz" \) | head -n1)
            echo "Archive: $TGZ"
            mkdir -p _src
            tar -xzf "$TGZ" -C _src
            S=$(find _src -name settings.gradle | head -n1)
            PROJ=$(dirname "$S")
          fi
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"
          echo "Project dir: $PROJ"
          ls -la "$PROJ"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.5.1'

      - name: Build debug APK
        working-directory: ${{ env.PROJ }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VJORO-player-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
